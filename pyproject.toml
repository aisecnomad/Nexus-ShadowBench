[tool.ruff]
line-length = 110
target-version = "py311"
# archive/ holds retained review artifacts; pre-commit's ruff hooks pass
# --force-exclude, so this keeps them from being rewritten.
exclude = [
  "tests/fixtures",
  "examples",
  "archive",
  # ShadowBench estate artifacts: authored sample repositories and exports
  # that discovery tools are scored on, not project code.
  "benchmarks/shadowbench/estate/artifacts",
]

[tool.ruff.lint]
# BLE: a broad `except` that does not re-raise is flagged; an intentional one
# carries `# noqa: BLE001 - <reason>` (tests/test_repository_consistency.py
# requires the reason). RUF100: a `noqa` that suppresses nothing is flagged.
# PGH004: a `noqa` must name its codes; a blanket one would silence every
# rule on its line, or in its file, without the reason the tests require.
# S (flake8-bandit): a security scanner should be held to the rule set it
# would apply to anything it scans. Every suppression in the package carries
# a reason, so each is a reviewed decision rather than an unexamined gap, and
# a new occurrence fails CI. S101 is off because `assert` is how the tests
# assert; the rest are scoped to the shipped package below, since test and
# tooling code legitimately holds fake credentials, runs the CLI as a
# subprocess, writes to temp paths and uses `random` for fixture data.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "BLE", "S", "RUF100", "PGH004"]
# Deliberate ignores, not debt. SIM102/SIM103/SIM105/SIM108 and C408 only
# propose equivalent rewrites (collapsed guards, `return cond`,
# contextlib.suppress, ternaries, dict literals); the longer forms stay.
# UP042 is not behaviour-preserving: StrEnum changes what `str()` and
# f-strings yield for the models.py enums, which serialise via `.value`.
ignore = ["SIM108", "SIM102", "SIM103", "C408", "SIM105", "UP042", "S101"]

[tool.ruff.lint.per-file-ignores]
# Tests hold long literal fixtures (source snippets, tokens, JSON records).
# The bandit rules target shipped code: a test's hard-coded token is the
# point of the test, and the harnesses run the CLI as a subprocess by design.
"tests/**" = ["E501", "S"]
"tools/**" = ["S"]
"benchmarks/**" = ["S"]
# Benchmark case templates embed source files from other languages verbatim.
"tools/benchmark/*_cases.py" = ["E501"]
"benchmarks/*/corpus.py" = ["E501"]

[tool.ruff.lint.isort]
# Preserve imported source formatting when the scanner is in a separate checkout.
known-first-party = ["benchmarks", "shadowscan", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Unknown markers and ini keys fail collection: a misspelt opt-out marker such
# as production_budgets would otherwise be ignored without a warning. No `-q`
# here: every documented command already passes one, and a second hides the
# pass/skip summary line.
addopts = "--strict-markers --strict-config"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
# ShadowBench estate artifacts are inputs under test, not project code.
exclude = ["benchmarks/shadowbench/estate/artifacts/"]
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disallow_untyped_defs = true
check_untyped_defs = true
# First-party imports and stubbed libraries (types-PyYAML, types-requests from
# the dev extra) are checked. The override below covers regex, boto3/botocore
# and oci, which ship neither stubs nor a py.typed marker, and the optional
# cloud SDKs google-auth and azure-identity, which are typed and are checked
# wherever they are installed (CI installs requirements.lock) but which
# `make install-dev` leaves out, so `make typecheck` must pass without them
# (tests/test_optional_sdk_typecheck.py).
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "regex",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "oci",
    "oci.*",
    "google",
    "google.auth",
    "google.auth.*",
    "azure.identity",
]
ignore_missing_imports = true

