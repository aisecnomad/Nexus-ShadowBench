name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 5 * * 1"  # Monday 05:29 UTC, staggered from Scorecard's 05:20 run
permissions:
  contents: read
# A newer push to the same pull request supersedes its analysis. Runs on main
# and the weekly schedule get a group of their own (the run id), so none is
# cancelled or replaced while queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    # `actions` analyses the workflows themselves (expression injection,
    # untrusted checkouts, over-broad tokens), which run with this
    # repository's OIDC identity and sign its results.
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The config analyses the harness and tests, not the authored estate
      # repositories or recorded results, which are untrusted inputs under test.
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
