name: Companion tests
on:
  push:
  pull_request:
  # Advisories are published between pushes: a daily run on main audits the
  # locks again, so a new one fails main's status within a day instead of
  # on the next contributor's pull request.
  schedule:
    - cron: "37 6 * * *"  # daily 06:37 UTC
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request supersedes its run. Pushes, the
# schedule and manual runs get a group of their own (the run id), so none is
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Verify signed historical evidence even if dependency installation or auditing fails.
  # This job needs only the standard library and cosign; it never installs the test locks.
  attestations:
    name: historical attestations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: Fetch the commit this change builds on
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Require every historical signature and verify the attested bytes
        run: python -m tools.attest verify --require-signatures ${BASE_SHA:+--since "$BASE_SHA"}

  tests:
    # Every workflow names its runner image: ubuntu-latest moves to a new OS
    # unannounced, under the byte-for-byte re-scores and the sandbox, so a move
    # is a reviewed change (tests/test_repository_policy.py).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aisecnomad/Nexus-ShadowScan
          ref: 0792106b8d2cc09517f7f4ee2eeabf4f8eb8da2d
          path: scanner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install the pinned scanner and hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock -r requirements-ci.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e ./scanner-source
      # Audit what was installed (the editable pinned scanner is unpublished
      # source, so its PyPI namesake is skipped) and every hash-locked set it
      # came from, and the cases track's installer toolchain: uv and the
      # setuptools it builds sdists with run as root in install_tools.sh. The
      # locks of the tools under test pin what is measured and only ever run
      # in the sandbox. migration/requirements.source.lock is provenance,
      # never installed, and keeps its historical pins.
      - name: Audit the hash-locked dependencies
        run: |
          pip-audit --skip-editable --progress-spinner off
          for lock in requirements.lock requirements-ci.lock requirements-build.lock \
            tools/shadowbench/cases/locks/uv.txt tools/shadowbench/cases/locks/build.txt; do
            pip-audit --require-hashes --strict --progress-spinner off --disable-pip -r "$lock"
          done
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      # A pull request, or a push to main, is compared with the commit it builds on: MIGRATION.json
      # must be unchanged, the amendment ledger only appended to, and no committed attestation file
      # changed or removed (tools.verify_migration --since, tools.attest verify --since).
      - name: Fetch the commit this change builds on
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          fi
      # --source anchors every MIGRATION.json record to the pinned ShadowScan tree checked out above.
      - name: Verify preserved evidence, result attestations and published paths, and run the harness tests
        run: |
          python -m tools.verify_migration --source scanner-source ${BASE_SHA:+--since "$BASE_SHA"}
          python -m tools.attest verify --require-signatures ${BASE_SHA:+--since "$BASE_SHA"}
          make paths PYTHON=python
          python -m pytest -q
      - name: Check harness source and synthetic-secret approvals
        run: |
          ruff check tests tools benchmarks
          ruff format --check tests tools benchmarks
          MYPYPATH=scanner-source mypy tools benchmarks
          git ls-files -z | xargs -0 python tools/check_secrets.py
          git ls-files -z | xargs -0 python tools/check_secrets_extra.py

  # The locks and the Makefile support CPython 3.11 to 3.14; the job above
  # gates on the oldest, this one installs the same binary-only locks on the
  # newest and runs the harness tests there. It is a separate job so the
  # required `tests` check keeps its name.
  tests-latest-python:
    name: tests on Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aisecnomad/Nexus-ShadowScan
          ref: 0792106b8d2cc09517f7f4ee2eeabf4f8eb8da2d
          path: scanner-source
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the pinned scanner and hash-locked test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock -r requirements-ci.lock -r requirements-build.lock
          python -m pip install --no-deps --no-build-isolation -e ./scanner-source
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: Run the harness tests
        run: python -m pytest -q
