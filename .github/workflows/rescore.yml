name: Clean-room rescore

# Weekly, on a fresh runner with nothing cached: install the pinned
# environment from scratch, verify every migrated and attested byte, rebuild
# the cases corpus, re-score every published run byte for byte and check the
# committed results for machine paths. A second job runs two third-party tools
# (installed from their hash locks) in the hardened sandbox on every endpoint
# and runtime case; it fails when the harness does not do its job and reports,
# without failing, how the tools' output drifts from the 2026-10-11 run.
on:
  schedule:
    - cron: "41 4 * * 2"  # Tuesday 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescore:
    name: Verify and re-score from scratch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: Install the hash-locked environment and the pinned scanner
        run: make install PYTHON=python
      - name: Verify evidence and attestations, rebuild the corpus, re-score every run
        run: |
          make verify PYTHON=python
          make integrity PYTHON=python
          make rescore PYTHON=python
          make paths PYTHON=python

  smoke:
    name: Level-2 smoke run in the sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install uv from its hash lock
        run: python -m pip install --require-hashes --no-deps -r tools/shadowbench/cases/locks/uv.txt
      - name: Install Fleet ai_tools and Microsoft agent-discovery from their locks
        run: |
          sudo env "PATH=$PATH" GOTOOLCHAIN=auto \
            bash tools/shadowbench/cases/install_tools.sh /opt/shadowbench/tools fleet-ai-tools agentmesh-discovery
      - name: Run them on every endpoint and runtime case
        run: |
          sudo "$(command -v python)" -m tools.shadowbench.cases run \
            --corpus benchmarks/shadowbench/cases/corpus.json --tools /opt/shadowbench/tools/tools.json \
            --out /tmp/smoke --only fleet-ai-tools,agentmesh-discovery --surfaces endpoint,runtime --workers 2
          sudo rm -rf /tmp/smoke/raw
          sudo chown -R "$(id -u):$(id -g)" /tmp/smoke
      - name: Fail on harness problems; report drift from the run of record
        run: |
          python -m tools.shadowbench.cases.smoke --results /tmp/smoke \
            --baseline benchmarks/shadowbench/cases/results/2026-10-11 --summary "$GITHUB_STEP_SUMMARY"
      - name: Scrub the run's records as for publication, then check them
        run: |
          python -m tools.shadowbench.scrub apply --map /opt/shadowbench/tools=\<tools\> --tmp \
            /tmp/smoke/manifest.json /tmp/smoke/*.jsonl /tmp/smoke/resolved
          python -m tools.shadowbench.scrub check --identity /tmp/smoke/manifest.json /tmp/smoke/*.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cases-smoke
          path: /tmp/smoke
          retention-days: 14
