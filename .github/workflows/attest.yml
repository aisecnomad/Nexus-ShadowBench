name: Attest results

# Sign a published results directory with Sigstore's keyless flow. The job
# writes attestations/<slug>.json (the SHA-256 of every file in the directory;
# python -m tools.attest digest), signs it with cosign through this workflow's
# GitHub OIDC identity into attestations/<slug>.sigstore.json (Fulcio
# certificate plus Rekor transparency-log entry), verifies the result, and
# uploads both files as an artifact for the maintainer to commit. Only a run
# on main signs: tools.attest verify accepts no other identity by default.
on:
  workflow_dispatch:
    inputs:
      results:
        description: "Results directory to attest, e.g. benchmarks/shadowbench/cases/results/2026-10-11"
        required: true
        type: string

permissions:
  contents: read

jobs:
  attest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # the OIDC token Fulcio issues the signing certificate for
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: Bind the results directory to its bytes
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          manifest="$(python -m tools.attest digest "$RESULTS")"
          echo "MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Sign the digest manifest with this workflow's identity
        run: cosign sign-blob --yes --bundle "${MANIFEST%.json}.sigstore.json" "$MANIFEST"
      - name: Verify the signature and every attested directory
        run: python -m tools.attest verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: attestations/
          retention-days: 30
