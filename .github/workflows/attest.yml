name: Attest results

# Sign a published results directory with Sigstore's keyless flow. The job
# writes attestations/<slug>.json (the SHA-256 of every file in the directory;
# python -m tools.attest digest), signs it with cosign through this workflow's
# GitHub OIDC identity into attestations/<slug>.sigstore.json (Fulcio
# certificate plus Rekor transparency-log entry), verifies the result, and
# uploads both files as an artifact for the maintainer to commit. Only a run
# on main signs: tools.attest verify accepts no other identity by default.
# A reviewed change to this workflow on main also signs all three preserved
# runs, allowing historical signing to bootstrap through a protected merge.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/attest.yml"
  workflow_dispatch:
    inputs:
      results:
        description: "Results directory to attest, e.g. benchmarks/shadowbench/cases/results/2026-10-11"
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  attest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write  # the OIDC token Fulcio issues the signing certificate for
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.4"
      - name: Bind the requested results to their bytes
        env:
          RESULTS: ${{ inputs.results }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            results=(
              benchmarks/shadowbench/cases/results/2026-10-11
              benchmarks/shadowbench/estate/results/2026-10-11
              benchmarks/shadow-ai-discovery/results/2026-10-09
            )
          else
            results=("$RESULTS")
          fi
          : > "$RUNNER_TEMP/attestation-manifests.txt"
          for result in "${results[@]}"; do
            manifest="$(python -m tools.attest digest "$result")"
            printf '%s\n' "$manifest" >> "$RUNNER_TEMP/attestation-manifests.txt"
          done
      - name: Verify committed bindings before signing
        run: python -m tools.attest verify --since "$GITHUB_SHA"
      - name: Sign missing manifests with this workflow's identity
        run: |
          while IFS= read -r manifest; do
            bundle="${manifest%.json}.sigstore.json"
            if [[ ! -e "$bundle" && ! -L "$bundle" ]]; then
              cosign sign-blob --yes --bundle "$bundle" "$manifest"
            fi
          done < "$RUNNER_TEMP/attestation-manifests.txt"
      - name: Verify the signatures and every attested directory
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            python -m tools.attest verify --require-signatures
          else
            python -m tools.attest verify
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: attestation
          path: attestations/
          retention-days: 30
