# Review routing comes from CODEOWNERS; the deprecated `reviewers` key is not
# used.
#
# pip is deliberately not tracked. requirements-ci.lock and
# requirements-build.lock are ShadowScan's hash locks at the pinned scanner
# revision, bound in MIGRATION.json and changed only through AMENDMENTS.json;
# the original runtime lock at migration/requirements.source.lock is
# provenance and never changes. requirements.lock is that runtime lock with
# security updates applied (aiohttp, certifi). Updates copy ShadowScan's pins
# and hashes rather than come from a Dependabot bump here, and CI's pip-audit
# step reports a new advisory against any installed lock.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    groups:
      # One pull request per weekly run. Sub-actions of one repository (for
      # example codeql-action init, analyze and upload-sarif) must move
      # together: a workflow that mixes their versions fails at analysis time.
      actions:
        patterns:
          - "*"
