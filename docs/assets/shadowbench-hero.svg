      <circle cx="38" cy="66" r="7" fill="#3ddc97"/><circle cx="64" cy="66" r="7" fill="none" stroke="#f4b942" stroke-width="2"/><circle cx="90" cy="66" r="7" fill="none" stroke="#2b4270" stroke-width="2"/>
    </g>
