    </g>
    <g transform="translate(1384 342)">
      <rect width="128" height="96" rx="12" fill="#121d38" stroke="#223a66" stroke-width="1.5"/>
      <text x="64" y="38" fill="#eef3ff">runtime</text>
      <circle cx="38" cy="66" r="7" fill="#3ddc97"/><circle cx="64" cy="66" r="7" fill="#f4b942"/><circle cx="90" cy="66" r="7" fill="none" stroke="#2b4270" stroke-width="2"/>
    </g>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#c9d4ea">
    <circle cx="1112" cy="476" r="7" fill="#3ddc97"/><text x="1128" y="482">found</text>
