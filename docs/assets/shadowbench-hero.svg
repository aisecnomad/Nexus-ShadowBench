<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Nexus ShadowBench</title>
  <desc id="desc">An open, reproducible benchmark for shadow AI agent discovery tools across nine surfaces: code, identity, gateway, low-code, SaaS, cloud, endpoint, network and runtime. Ground truth includes decoys and near-misses, scoring fails closed, and every input and result is bound by SHA-256.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="1600" height="560" fill="url(#bg)"/>
  <text x="90" y="108" font-size="24" fill="#f4b942" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" letter-spacing="4">OPEN BENCHMARK · SHADOW AI AGENT DISCOVERY</text>
  <text x="86" y="226" font-size="92" font-weight="700" fill="#eef3ff" letter-spacing="-2">Nexus ShadowBench</text>
  <text x="90" y="304" font-size="29" fill="#c9d4ea">Which AI agents can a discovery tool find, on which surface,</text>
  <text x="90" y="344" font-size="29" fill="#c9d4ea">and at what false-positive cost? Tool-neutral ground truth,</text>
  <text x="90" y="384" font-size="29" fill="#c9d4ea">decoys that sound like AI, fail-closed scoring, every byte hashed.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" text-anchor="middle">
    <rect x="90" y="428" width="160" height="46" rx="23" fill="#162544" stroke="#2b4270" stroke-width="1.5"/>
    <text x="170" y="457" fill="#c9d4ea">Apache-2.0</text>
    <rect x="266" y="428" width="270" height="46" rx="23" fill="#0d2818" stroke="#1a5c32" stroke-width="1.5"/>
    <text x="401" y="457" fill="#3ddc97">9 surfaces · 3 tracks</text>
    <rect x="552" y="428" width="340" height="46" rx="23" fill="#2a2210" stroke="#6b4e12" stroke-width="1.5"/>
    <text x="722" y="457" fill="#f4b942">555 files SHA-256 bound</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">
    <g transform="translate(1104 118)">
